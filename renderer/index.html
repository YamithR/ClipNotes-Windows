<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipNotes</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="window-bar" id="windowBar">
    <span class="window-title">ClipNotes</span>
    <div class="window-controls">
      <span id="settingsBtn" class="ctrl-btn" title="Configuración">⚙</span>
      <span id="infoBtn" class="ctrl-btn" title="Acerca de">ⓘ</span>
      <span id="closeBtn" class="ctrl-btn close" title="Cerrar">&times;</span>
    </div>
  </div>

  <div class="container">
    <div id="headerBar" class="header-bar hidden">
      <button id="backBtn" class="nav-btn">← Volver</button>
      <span id="currentDir" class="dir-label"></span>
    </div>

    <div id="noFolder" class="no-folder">
      <div class="nf-icon">📋</div>
      <div class="nf-text">Selecciona una carpeta con notas</div>
      <button id="selectFolderBtn" class="primary-btn">Seleccionar carpeta</button>
    </div>

    <div id="fileList" class="file-list hidden"></div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <span>Configuración</span>
        <span class="modal-close" id="settingsClose">&times;</span>
      </div>
      <div class="modal-body">
        <div class="setting-row">
          <label>Atajo de teclado</label>
          <input type="text" id="shortcutInput" class="shortcut-input" readonly
                 placeholder="Presiona una tecla..."
                 value="Ctrl+Shift+N">
          <button id="shortcutBtn" class="modal-btn">Cambiar</button>
        </div>
        <div class="setting-row">
          <label>Carpeta de notas</label>
          <button id="changeFolderBtn" class="modal-btn">Cambiar carpeta</button>
        </div>
        <div class="setting-row">
          <label>Ocultar extensiones</label>
          <input type="checkbox" id="stripToggle">
        </div>
        <div class="setting-row">
          <label>Siempre al frente</label>
          <input type="checkbox" id="ontopToggle">
        </div>
      </div>
    </div>
  </div>

  <div id="aboutModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <span>Acerca de ClipNotes</span>
        <span class="modal-close" id="aboutClose">&times;</span>
      </div>
      <div class="modal-body about-body">
        <div id="aboutContent"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
